<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Gestão de autorizações · HS</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#FFFFFF;--tx:#14171C;--mut:#5C6577;--bd:#DFE3EA;--pri:#0071A3;--pri-tx:#FFFFFF;--ok:#1B7F3A;--warn:#B26B00;--err:#E3262B;--in:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#0F1216;--card:#181C22;--tx:#EEF1F5;--mut:#9AA3B2;--bd:#2A303A;--pri:#33C0FF;--pri-tx:#06212E;--ok:#3DBE6B;--warn:#F0A43A;--err:#FF5A5F;--in:#11151A}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
header .logo{width:32px;height:32px;border-radius:8px;background:#00A0E7;display:grid;place-items:center;color:#fff;font-weight:800}
header .nm{font-weight:700}header .sp{flex:1}.quem{color:var(--mut);font-size:13px}
.faixa{display:flex;height:4px}.faixa i{flex:1}main{max-width:1100px;margin:0 auto;padding:16px}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{min-height:40px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}.chip b{margin-left:6px}
input,select,textarea{min-height:40px;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.busca{flex:1;min-width:200px}.btn{min-height:40px;border-radius:10px;border:0;background:var(--pri);color:var(--pri-tx);font:inherit;font-weight:700;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--bd)}.btn.red{background:var(--err);color:#fff}.btn.ok{background:var(--ok);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.topo{display:flex;justify-content:space-between;gap:8px;align-items:center}.num{font-weight:800;font-size:16px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fff;background:var(--mut)}
.b-Pendente{background:var(--warn)}.b-Emitida{background:var(--ok)}.b-Parcialmente{background:var(--warn)}.b-Atendida{background:#5C6577}.b-Expirada,.b-Cancelada,.b-Recusada{background:var(--err)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:10px 0;font-size:14px}dt{color:var(--mut)}dd{margin:0;font-weight:600;word-break:break-word}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.meta{color:var(--mut);font-size:13px}
.msg{border-radius:10px;padding:10px 12px;margin:12px 0;background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.at{border-top:1px solid var(--bd);margin-top:8px;padding-top:8px;font-size:13px}ul{margin:4px 0;padding-left:18px}
#imp{display:none}
@media print{body{background:#fff;color:#000}header,.faixa,main{display:none!important}#imp{display:block}
#imp .doc{border:2px solid #000;border-radius:8px;padding:16px;max-width:680px;margin:0 auto;font-size:13px}
#imp .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:4px solid #00A0E7;padding-bottom:8px}
#imp h1{font-size:20px;margin:0}#imp .n{font-size:18px;font-weight:800;color:#E3262B}#imp .qr svg{width:150px;height:150px}
#imp table{width:100%;border-collapse:collapse;margin-top:10px}#imp td{border:1px solid #999;padding:5px 7px;vertical-align:top}#imp td:first-child{width:32%;font-weight:700;background:#f2f2f2}
#imp .rod{margin-top:10px;font-size:12px}}
</style>
</head>
<body>
<header><div class="logo">HS</div><span class="nm">Gestão de autorizações</span><span class="sp"></span><span class="quem" id="quem"></span>
  <a class="btn ghost" href="/api/gestao/exportar">Exportar CSV</a><button class="btn ghost" type="button" id="btnRec">Atualizar</button></header>
<div class="faixa"><i style="background:#00A0E7"></i><i style="background:#FE0000"></i><i style="background:#FFE500"></i></div>
<main>
  <div class="barra" id="chips"></div>
  <div class="barra"><input class="busca" id="q" placeholder="Buscar por número, colaborador, obra, veículo…"></div>
  <div id="aviso"></div>
  <div class="grid" id="lista"></div>
</main>
<div id="imp"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var FILTROS = ["Pendente", "Emitida", "Parcialmente atendida", "Atendida", "Expirada", "Recusada", "Cancelada", "todas"];
  var filtro = "Pendente", dados = [], contagem = {};
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function quando(iso) { if (!iso) return ""; try { return new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } }
  function brl(v) { return v == null ? "" : "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function nbr(v) { return v == null ? "" : String(v).replace(".", ","); }
  function aviso(t) { $("aviso").innerHTML = t ? '<div class="msg">' + esc(t) + '</div>' : ""; }
  function padrao() { var d = new Date(); d.setDate(d.getDate() + 1); d.setHours(18, 0, 0, 0); var p = function (x) { return String(x).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()); }

  function carregar() {
    aviso("");
    fetch("/api/gestao/autorizacoes?status=todas").then(function (r) {
      if (r.status === 401) throw new Error("login");
      return r.json();
    }).then(function (j) {
      if (!j.ok) { aviso(j.msg || j.erro); return; }
      dados = j.autorizacoes; contagem = j.contagem || {}; $("quem").textContent = j.quem || "";
      desenhar();
    }).catch(function (e) {
      aviso(e && e.message === "login" ? "Acesso negado. Entre com o login da HS (Cloudflare Access) e recarregue a página." : "Não consegui carregar a lista.");
    });
  }
  function desenhar() {
    $("chips").innerHTML = FILTROS.map(function (f) {
      var n = f === "todas" ? dados.length : (contagem[f] || 0);
      return '<button type="button" class="chip' + (f === filtro ? " on" : "") + '" data-f="' + esc(f) + '">' + (f === "todas" ? "Todas" : esc(f)) + '<b>' + n + '</b></button>';
    }).join("");
    document.querySelectorAll("[data-f]").forEach(function (b) { b.addEventListener("click", function () { filtro = b.getAttribute("data-f"); desenhar(); }); });
    var q = $("q").value.trim().toLowerCase();
    var l = dados.filter(function (a) {
      if (filtro !== "todas" && a.status_visivel !== filtro) return false;
      if (!q) return true;
      return [a.numero, a.colaborador, a.obra, a.tipo, a.veiculo, a.estabelecimento].join(" ").toLowerCase().indexOf(q) >= 0;
    });
    $("lista").innerHTML = l.length ? l.map(cartao).join("") : '<div class="meta">Nada aqui.</div>';
    l.forEach(ligar);
  }
  function cartao(a) {
    var st = a.status_visivel, h = '<div class="card" id="c-' + esc(a.numero) + '"><div class="topo"><span class="num">' + esc(a.numero) + '</span><span class="badge b-' + esc(String(st).split(" ")[0]) + '">' + esc(st) + '</span></div><dl>';
    h += '<dt>Tipo</dt><dd>' + esc(a.tipo) + '</dd><dt>Colaborador</dt><dd>' + esc(a.colaborador) + '</dd><dt>Obra / C.C.</dt><dd>' + esc((a.empresa ? a.empresa + " · " : "") + a.obra) + '</dd>';
    if (a.estabelecimento) h += '<dt>Estabelecimento</dt><dd>' + esc(a.estabelecimento) + '</dd>';
    if (a.veiculo) h += '<dt>Veículo</dt><dd>' + esc(a.veiculo) + (a.km ? " · km " + esc(a.km) : "") + '</dd>';
    if (a.combustivel) h += '<dt>Combustível</dt><dd>' + esc(a.combustivel) + (a.litros_max ? " · até " + nbr(a.litros_max) + " L" : "") + '</dd>';
    if (a.justificativa) h += '<dt>Para quê</dt><dd>' + esc(a.justificativa) + '</dd>';
    h += '<dt>Pedido em</dt><dd>' + esc(quando(a.solicitado_em)) + '</dd>';
    if (a.validade) h += '<dt>Válida até</dt><dd>' + esc(quando(a.validade)) + '</dd>';
    if (a.decidido_por) h += '<dt>Decidido por</dt><dd>' + esc(a.decidido_por) + ' · ' + esc(quando(a.decidido_em)) + '</dd>';
    if (a.motivo) h += '<dt>Motivo</dt><dd>' + esc(a.motivo) + '</dd>';
    h += '</dl>';
    if (a.itens && a.itens.length) h += '<ul>' + a.itens.map(function (x) { return '<li>' + esc(x.descricao) + (x.qtd != null ? ' — ' + nbr(x.qtd) + ' ' + esc(x.unidade || "") : '') + '</li>'; }).join("") + '</ul>';
    (a.atendimentos || []).forEach(function (x) {
      h += '<div class="at"><b>Cupom</b> ' + esc(x.data_cupom || "") + ' · ' + esc(x.estabelecimento || x.cnpj || "") + (x.numero_nf ? ' · NF ' + esc(x.numero_nf) : '') + ' · <b>' + brl(x.valor_total) + '</b>' + (x.parcial ? ' · parcial' : '') +
        (x.chave_nfce ? '<div class="meta">chave ' + esc(x.chave_nfce) + '</div>' : '') + (x.observacao ? '<div class="meta">' + esc(x.observacao) + '</div>' : '') + '</div>';
    });
    h += '<div class="acoes">';
    if (a.status === "Pendente") {
      h += '<label class="meta">Válida até <input type="datetime-local" data-val value="' + padrao() + '"></label>';
      h += '<button class="btn ok" type="button" data-ac="aprovar">Aprovar e emitir</button><button class="btn red" type="button" data-ac="recusar">Recusar</button>';
    }
    if (st === "Emitida" || st === "Parcialmente atendida" || st === "Expirada") {
      h += '<button class="btn" type="button" data-ac="imprimir">Imprimir</button><button class="btn ghost" type="button" data-ac="link">Copiar link do colaborador</button>';
    }
    if (a.status === "Pendente" || a.status === "Emitida" || a.status === "Parcialmente atendida") h += '<button class="btn ghost" type="button" data-ac="cancelar">Cancelar</button>';
    return h + '</div></div>';
  }
  function ligar(a) {
    var c = document.getElementById("c-" + a.numero); if (!c) return;
    c.querySelectorAll("[data-ac]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ac = b.getAttribute("data-ac");
        if (ac === "imprimir") return imprimir(a);
        if (ac === "link") {
          var url = location.origin + "/autorizacao/#n=" + encodeURIComponent(a.numero) + "&k=" + encodeURIComponent(a.chave_solicitante);
          (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { b.textContent = "Link copiado"; }, function () { prompt("Link do colaborador:", url); });
          return;
        }
        var corpo = { numero: a.numero, acao: ac };
        if (ac === "aprovar") {
          var v = c.querySelector("[data-val]").value; if (!v) { alert("Informe a validade."); return; }
          corpo.validade = new Date(v).toISOString();
          if (!confirm("Aprovar e emitir " + a.numero + " para " + a.colaborador + ", válida até " + quando(corpo.validade) + "?")) return;
        } else {
          var m = prompt(ac === "recusar" ? "Motivo da recusa:" : "Motivo do cancelamento:"); if (!m) return; corpo.motivo = m;
        }
        b.disabled = true;
        fetch("/api/gestao/decidir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) })
          .then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) alert(j.msg || j.erro); carregar(); })
          .catch(function () { b.disabled = false; alert("Sem conexão."); });
      });
    });
  }
  function imprimir(a) {
    var qr = ""; try { var q = qrcode(0, "M"); q.addData(location.origin + "/v/" + a.token_qr); q.make(); qr = q.createSvgTag({ cellSize: 4, margin: 1, scalable: true }); } catch (e) {}
    var linhas = [["Tipo", a.tipo], ["Colaborador", a.colaborador], ["Empresa / obra ou C.C.", (a.empresa ? a.empresa + " · " : "") + a.obra]];
    if (a.estabelecimento) linhas.push(["Estabelecimento", a.estabelecimento]);
    if (a.veiculo) linhas.push(["Veículo / km", a.veiculo + (a.km ? " · km " + a.km : "")]);
    if (a.combustivel) linhas.push(["Combustível", a.combustivel + (a.litros_max ? " · até " + nbr(a.litros_max) + " L" : "")]);
    if (a.itens && a.itens.length) linhas.push(["Itens", a.itens.map(function (x) { return x.descricao + (x.qtd != null ? " — " + nbr(x.qtd) + " " + (x.unidade || "") : ""); }).join("\n")]);
    linhas.push(["Válida até", quando(a.validade)], ["Autorizado por", (a.decidido_por || "") + " em " + quando(a.decidido_em)]);
    $("imp").innerHTML = '<div class="doc"><div class="cab"><div><h1>HS ELETRICIDADE</h1><div>AUTORIZAÇÃO DE COMPRA</div><div class="n">' + esc(a.numero) + '</div></div><div class="qr">' + qr + '</div></div>' +
      '<table>' + linhas.map(function (l) { return '<tr><td>' + esc(l[0]) + '</td><td>' + esc(l[1]).replace(/\n/g, "<br>") + '</td></tr>'; }).join("") + '</table>' +
      '<div class="rod">Uso único. O estabelecimento confere a autenticidade e a validade lendo o QR. A compra é registrada pelo cupom fiscal no app da HS.</div></div>';
    setTimeout(function () { window.print(); }, 50);
  }
  $("q").addEventListener("input", desenhar);
  $("btnRec").addEventListener("click", carregar);
  carregar();
})();
</script>
</body>
</html>
