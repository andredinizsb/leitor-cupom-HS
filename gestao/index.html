<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Gestão de autorizações · HS</title>
<link rel="icon" href="/icons/gestao.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/gestao-apple.png">
<link rel="manifest" href="/icons/gestao.webmanifest">
<meta name="theme-color" content="#0E1217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestão HS">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#FFFFFF;--tx:#14171C;--mut:#5C6577;--bd:#DFE3EA;--pri:#0071A3;--pri-tx:#FFFFFF;--ok:#1B7F3A;--warn:#B26B00;--err:#E3262B;--in:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#0F1216;--card:#181C22;--tx:#EEF1F5;--mut:#9AA3B2;--bd:#2A303A;--pri:#33C0FF;--pri-tx:#06212E;--ok:#3DBE6B;--warn:#F0A43A;--err:#FF5A5F;--in:#11151A}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
header .logo{width:32px;height:32px;border-radius:8px;background:#00A0E7;display:grid;place-items:center;color:#fff;font-weight:800}
header .nm{font-weight:700}header .sp{flex:1}.quem{color:var(--mut);font-size:13px}
.faixa{display:flex;height:4px}.faixa i{flex:1}main{max-width:1100px;margin:0 auto;padding:16px}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{min-height:40px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}.chip b{margin-left:6px}
input,select,textarea{min-height:40px;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
.busca{flex:1;min-width:200px}.btn{min-height:40px;border-radius:10px;border:0;background:var(--pri);color:var(--pri-tx);font:inherit;font-weight:700;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--bd)}.btn.red{background:var(--err);color:#fff}.btn.ok{background:var(--ok);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.topo{display:flex;justify-content:space-between;gap:8px;align-items:center}.num{font-weight:800;font-size:16px}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fff;background:var(--mut)}
.b-Pendente{background:var(--warn)}.b-Emitida{background:var(--ok)}.b-Parcialmente{background:var(--warn)}.b-Atendida{background:#5C6577}.b-Expirada,.b-Cancelada,.b-Recusada{background:var(--err)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:10px 0;font-size:14px}dt{color:var(--mut)}dd{margin:0;font-weight:600;word-break:break-word}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.meta{color:var(--mut);font-size:13px}
.msg{border-radius:10px;padding:10px 12px;margin:12px 0;background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.at{border-top:1px solid var(--bd);margin-top:8px;padding-top:8px;font-size:13px}ul{margin:4px 0;padding-left:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30;align-items:center;justify-content:center;padding:12px}.modal.on{display:flex}
.modal .box{background:var(--card);color:var(--tx);border-radius:16px;max-width:820px;width:100%;max-height:94vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 4px;font-size:18px}.lbl{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}.full{width:100%}
.pad{width:100%;height:190px;background:#fff;border:2px dashed #9aa3b2;border-radius:12px;touch-action:none;cursor:crosshair;display:block}
.pad-hint{color:var(--mut);font-size:13px;margin-top:4px}
@media print{body{background:#fff}header,.faixa,main,.modal .acoes,.modal h3,.modal .meta{display:none!important}.modal{position:static;background:none;padding:0;display:block!important}.modal:not(.imprimir){display:none!important}.modal .box{max-height:none;box-shadow:none;padding:0}}
</style>
</head>
<body>
<header><div class="logo">HS</div><span class="nm">Gestão de autorizações</span><span class="sp"></span><span class="quem" id="quem"></span>
  <a class="btn ghost" href="/gestao/rdo/">RDOs</a><a class="btn ghost" href="/gestao/checklist/">Checklists</a><a class="btn ghost" href="/gestao/frota/">Frota</a><a class="btn ghost" href="/api/gestao/exportar">Exportar CSV</a><button class="btn ghost" type="button" id="btnRec">Atualizar</button></header>
<div class="faixa"><i style="background:#00A0E7"></i><i style="background:#FE0000"></i><i style="background:#FFE500"></i></div>
<main>
  <div class="barra" id="chips"></div>
  <div class="barra"><input class="busca" id="q" placeholder="Buscar por número, colaborador, obra, veículo…"></div>
  <div id="aviso"></div>
  <div class="grid" id="lista"></div>
</main>

<!-- assinatura de quem libera o canhoto -->
<div class="modal" id="mAss"><div class="box">
  <h3 id="assTit">Assinar e aprovar</h3>
  <div class="meta" id="assSub"></div>
  <label class="lbl" for="assNome">Nome de quem assina</label><input class="full" id="assNome" placeholder="Seu nome">
  <label class="lbl">Assinatura <span class="meta">(mouse, dedo ou caneta)</span></label>
  <canvas class="pad" id="pad"></canvas>
  <div class="pad-hint">Assine dentro do quadro. <a href="#" id="padLimpar">Limpar</a> · <a href="#" id="padSalva">Usar assinatura salva</a></div>
  <label class="meta" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="assLembrar"> Lembrar minha assinatura neste aparelho</label>
  <div class="acoes" style="justify-content:flex-end"><button class="btn ghost" type="button" id="assCancelar">Cancelar</button><button class="btn ok" type="button" id="assOk">Aprovar e emitir canhoto</button></div>
</div></div>

<!-- canhoto emitido -->
<div class="modal" id="mCnh"><div class="box">
  <h3 id="cnhTit">Canhoto</h3>
  <div id="cnhCorpo"></div>
  <div class="acoes" style="justify-content:flex-end">
    <button class="btn ghost" type="button" id="cnhLink">Copiar link do colaborador</button>
    <button class="btn ghost" type="button" id="cnhImp">Imprimir</button>
    <button class="btn" type="button" id="cnhPdf">Baixar PDF</button>
    <button class="btn" type="button" id="cnhEnv">Enviar</button>
    <button class="btn ghost" type="button" id="cnhFechar">Fechar</button>
  </div>
</div></div>

<script src="/autorizacao/canhoto.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var FILTROS = ["Pendente", "Emitida", "Parcialmente atendida", "Atendida", "Expirada", "Recusada", "Cancelada", "todas"];
  var filtro = "Pendente", dados = [], contagem = {};
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function quando(iso) { if (!iso) return ""; try { return new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } }
  function brl(v) { return v == null ? "" : "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function nbr(v) { return v == null ? "" : String(v).replace(".", ","); }
  function aviso(t) { $("aviso").innerHTML = t ? '<div class="msg">' + esc(t) + '</div>' : ""; }
  function padrao() { var d = new Date(); d.setDate(d.getDate() + 1); d.setHours(18, 0, 0, 0); var p = function (x) { return String(x).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()); }

  function carregar() {
    aviso("");
    fetch("/api/gestao/autorizacoes?status=todas").then(function (r) {
      if (r.status === 401) throw new Error("login");
      return r.json();
    }).then(function (j) {
      if (!j.ok) { aviso(j.msg || j.erro); return; }
      dados = j.autorizacoes; contagem = j.contagem || {}; $("quem").textContent = j.quem || "";
      desenhar();
    }).catch(function (e) {
      aviso(e && e.message === "login" ? "Acesso negado. Entre com o login da HS (Cloudflare Access) e recarregue a página." : "Não consegui carregar a lista.");
    });
  }
  function desenhar() {
    $("chips").innerHTML = FILTROS.map(function (f) {
      var n = f === "todas" ? dados.length : (contagem[f] || 0);
      return '<button type="button" class="chip' + (f === filtro ? " on" : "") + '" data-f="' + esc(f) + '">' + (f === "todas" ? "Todas" : esc(f)) + '<b>' + n + '</b></button>';
    }).join("");
    document.querySelectorAll("[data-f]").forEach(function (b) { b.addEventListener("click", function () { filtro = b.getAttribute("data-f"); desenhar(); }); });
    var q = $("q").value.trim().toLowerCase();
    var l = dados.filter(function (a) {
      if (filtro !== "todas" && a.status_visivel !== filtro) return false;
      if (!q) return true;
      return [a.numero, a.colaborador, a.obra, a.tipo, a.veiculo, a.estabelecimento].join(" ").toLowerCase().indexOf(q) >= 0;
    });
    $("lista").innerHTML = l.length ? l.map(cartao).join("") : '<div class="meta">Nada aqui.</div>';
    l.forEach(ligar);
  }
  function cartao(a) {
    var st = a.status_visivel, h = '<div class="card" id="c-' + esc(a.numero) + '"><div class="topo"><span class="num">' + esc(a.numero) + '</span><span class="badge b-' + esc(String(st).split(" ")[0]) + '">' + esc(st) + '</span></div><dl>';
    h += '<dt>Tipo</dt><dd>' + esc(a.tipo) + '</dd><dt>Colaborador</dt><dd>' + esc(a.colaborador) + '</dd><dt>Obra</dt><dd>' + esc((a.empresa ? a.empresa + " · " : "") + a.obra) + '</dd>';
    if (a.estabelecimento) h += '<dt>Estabelecimento</dt><dd>' + esc(a.estabelecimento) + '</dd>';
    if (a.veiculo) h += '<dt>Veículo</dt><dd>' + esc(a.veiculo) + (a.marca_modelo ? " · " + esc(a.marca_modelo) : "") + (a.km ? " · km " + esc(a.km) : "") + '</dd>';
    if (a.combustivel) h += '<dt>Combustível</dt><dd>' + esc(a.combustivel) + (a.litros_max ? " · até " + nbr(a.litros_max) + " L" : "") + '</dd>';
    if (a.justificativa) h += '<dt>' + (a.tipo === "Abastecimento" ? "Destino" : "Para quê") + '</dt><dd>' + esc(a.justificativa) + '</dd>';
    h += '<dt>Pedido em</dt><dd>' + esc(quando(a.solicitado_em)) + '</dd>';
    if (a.validade) h += '<dt>Válida até</dt><dd>' + esc(quando(a.validade)) + '</dd>';
    if (a.decidido_por) h += '<dt>Decidido por</dt><dd>' + esc(a.decidido_por) + ' · ' + esc(quando(a.decidido_em)) + '</dd>';
    if (a.assinado_por_nome) h += '<dt>Assinado por</dt><dd>' + esc(a.assinado_por_nome) + '</dd>';
    if (a.motivo) h += '<dt>Motivo</dt><dd>' + esc(a.motivo) + '</dd>';
    h += '</dl>';
    if (a.itens && a.itens.length) h += '<ul>' + a.itens.map(function (x) { return '<li>' + esc(x.descricao) + (x.qtd != null ? ' — ' + nbr(x.qtd) + ' ' + esc(x.unidade || "") : '') + '</li>'; }).join("") + '</ul>';
    (a.atendimentos || []).forEach(function (x) {
      h += '<div class="at"><b>Cupom</b> ' + esc(x.data_cupom || "") + ' · ' + esc(x.estabelecimento || x.cnpj || "") + (x.numero_nf ? ' · NF ' + esc(x.numero_nf) : '') + ' · <b>' + brl(x.valor_total) + '</b>' + (x.parcial ? ' · parcial' : '') +
        (x.chave_nfce ? '<div class="meta">chave ' + esc(x.chave_nfce) + '</div>' : '') + (x.observacao ? '<div class="meta">' + esc(x.observacao) + '</div>' : '') + '</div>';
    });
    h += '<div class="acoes">';
    if (a.status === "Pendente") {
      h += '<label class="meta">Válida até <input type="datetime-local" data-val value="' + padrao() + '"></label>';
      h += '<button class="btn ok" type="button" data-ac="aprovar">Assinar e aprovar</button><button class="btn red" type="button" data-ac="recusar">Recusar</button>';
    }
    if (a.decidido_em && a.status !== "Recusada") {
      h += '<button class="btn" type="button" data-ac="canhoto">Ver canhoto / PDF</button><button class="btn ghost" type="button" data-ac="link">Copiar link do colaborador</button>';
    }
    if (a.status === "Pendente" || a.status === "Emitida" || a.status === "Parcialmente atendida") h += '<button class="btn ghost" type="button" data-ac="cancelar">Cancelar</button>';
    return h + '</div></div>';
  }
  function ligar(a) {
    var c = document.getElementById("c-" + a.numero); if (!c) return;
    c.querySelectorAll("[data-ac]").forEach(function (b) {
      b.addEventListener("click", function () {
        var ac = b.getAttribute("data-ac");
        if (ac === "canhoto") return abrirCanhoto(a.numero);
        if (ac === "link") return copiarLink(a, b);
        var corpo = { numero: a.numero, acao: ac };
        if (ac === "aprovar") {
          var v = c.querySelector("[data-val]").value; if (!v) { alert("Informe a validade."); return; }
          corpo.validade = new Date(v).toISOString();
          return abrirAssinatura(a, corpo);
        } else {
          var m = prompt(ac === "recusar" ? "Motivo da recusa:" : "Motivo do cancelamento:"); if (!m) return; corpo.motivo = m;
        }
        b.disabled = true;
        fetch("/api/gestao/decidir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) })
          .then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) alert(j.msg || j.erro); carregar(); })
          .catch(function () { b.disabled = false; alert("Sem conexão."); });
      });
    });
  }
  function copiarLink(a, b) {
    var url = location.origin + "/autorizacao/#n=" + encodeURIComponent(a.numero) + "&k=" + encodeURIComponent(a.chave_solicitante);
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { b.textContent = "Link copiado"; }, function () { prompt("Link do colaborador:", url); });
  }

  // ---- assinatura (mouse, dedo ou caneta) ----
  var LS_NOME = "hsAssNome", LS_IMG = "hsAssImg";
  var pad = $("pad"), ctx = pad.getContext("2d"), riscou = false, desenhando = false, pendente = null;
  function prepararPad() {
    var r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    pad.width = Math.round(r.width * dpr); pad.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0d2a7a";
    ctx.clearRect(0, 0, r.width, r.height); riscou = false;
  }
  function ponto(e) { var r = pad.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  pad.addEventListener("pointerdown", function (e) { e.preventDefault(); pad.setPointerCapture(e.pointerId); desenhando = true; var p = ponto(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke(); riscou = true; });
  pad.addEventListener("pointermove", function (e) { if (!desenhando) return; e.preventDefault(); var p = ponto(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) { pad.addEventListener(ev, function () { desenhando = false; }); });
  $("padLimpar").addEventListener("click", function (e) { e.preventDefault(); prepararPad(); });
  $("padSalva").addEventListener("click", function (e) {
    e.preventDefault(); var s = null; try { s = localStorage.getItem(LS_IMG); } catch (x) {}
    if (!s) { alert("Nenhuma assinatura salva neste aparelho."); return; }
    var im = new Image(); im.onload = function () { prepararPad(); var r = pad.getBoundingClientRect(), k = Math.min(r.width / im.width, r.height / im.height); ctx.drawImage(im, (r.width - im.width * k) / 2, (r.height - im.height * k) / 2, im.width * k, im.height * k); riscou = true; }; im.src = s;
  });
  // recorta a área desenhada (menos bytes, assinatura bem enquadrada no canhoto)
  function assinaturaPNG() {
    var w = pad.width, h = pad.height, d = ctx.getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) return null;
    var m = 8, cw = Math.min(w, x1 - x0 + 2 * m), ch = Math.min(h, y1 - y0 + 2 * m), out = document.createElement("canvas"), esc2 = Math.min(1, 600 / cw);
    out.width = Math.round(cw * esc2); out.height = Math.round(ch * esc2);
    out.getContext("2d").drawImage(pad, Math.max(0, x0 - m), Math.max(0, y0 - m), cw, ch, 0, 0, out.width, out.height);
    return out.toDataURL("image/png");
  }
  function abrirAssinatura(a, corpo) {
    pendente = { a: a, corpo: corpo };
    $("assSub").textContent = a.numero + " · " + a.tipo + " · " + a.colaborador + " · válida até " + quando(corpo.validade);
    try { $("assNome").value = localStorage.getItem(LS_NOME) || ""; $("assLembrar").checked = !!localStorage.getItem(LS_IMG); } catch (x) {}
    $("mAss").classList.add("on"); setTimeout(prepararPad, 30);
  }
  $("assCancelar").addEventListener("click", function () { $("mAss").classList.remove("on"); pendente = null; });
  $("assOk").addEventListener("click", function () {
    if (!pendente) return;
    var nome = $("assNome").value.trim(); if (!nome) { alert("Informe o nome de quem assina."); return; }
    var img = riscou ? assinaturaPNG() : null; if (!img) { alert("Assine dentro do quadro."); return; }
    try { localStorage.setItem(LS_NOME, nome); if ($("assLembrar").checked) localStorage.setItem(LS_IMG, img); else localStorage.removeItem(LS_IMG); } catch (x) {}
    var corpo = pendente.corpo, num = pendente.a.numero; corpo.assinatura = img; corpo.assinado_por = nome;
    $("assOk").disabled = true;
    fetch("/api/gestao/decidir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) })
      .then(function (r) { return r.json(); }).then(function (j) {
        $("assOk").disabled = false;
        if (!j.ok) { alert(j.msg || j.erro); return; }
        $("mAss").classList.remove("on"); pendente = null; carregar(); abrirCanhoto(num);
      }).catch(function () { $("assOk").disabled = false; alert("Sem conexão."); });
  });

  // ---- canhoto emitido ----
  var cnhAtual = null;
  function abrirCanhoto(n) {
    $("cnhTit").textContent = "Canhoto " + n; $("cnhCorpo").innerHTML = '<div class="meta">Carregando…</div>'; $("mCnh").classList.add("on");
    fetch("/api/gestao/canhoto?n=" + encodeURIComponent(n)).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) { $("cnhCorpo").innerHTML = '<div class="msg">' + esc(j.msg || j.erro) + '</div>'; return; }
      cnhAtual = j.autorizacao; $("cnhCorpo").innerHTML = HSCanhoto.render(cnhAtual);
    }).catch(function () { $("cnhCorpo").innerHTML = '<div class="msg">Sem conexão.</div>'; });
  }
  function acao(b, fn) { if (!cnhAtual) return; var t = b.textContent; b.disabled = true; b.textContent = "Gerando PDF…"; fn(cnhAtual).catch(function () { alert("Não consegui gerar o PDF."); }).then(function () { b.disabled = false; b.textContent = t; }); }
  $("cnhPdf").addEventListener("click", function () { acao(this, HSCanhoto.pdf); });
  $("cnhEnv").addEventListener("click", function () { acao(this, HSCanhoto.enviar); });
  $("cnhLink").addEventListener("click", function () { if (cnhAtual) copiarLink(cnhAtual, this); });
  $("cnhImp").addEventListener("click", function () { $("mCnh").classList.add("imprimir"); window.print(); setTimeout(function () { $("mCnh").classList.remove("imprimir"); }, 500); });
  $("cnhFechar").addEventListener("click", function () { $("mCnh").classList.remove("on"); cnhAtual = null; $("cnhLink").textContent = "Copiar link do colaborador"; });
  $("q").addEventListener("input", desenhar);
  $("btnRec").addEventListener("click", carregar);
  carregar();
})();
</script>
<script src="/gestao/aviso-limites.js" defer></script>
</body>
</html>
