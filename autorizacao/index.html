<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Autorizações · HS</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#FFFFFF;--tx:#14171C;--mut:#5C6577;--bd:#DFE3EA;--pri:#0071A3;--pri-tx:#FFFFFF;--ok:#1B7F3A;--warn:#B26B00;--err:#E3262B;--soft:#E6F0FB;--in:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--bg:#0F1216;--card:#181C22;--tx:#EEF1F5;--mut:#9AA3B2;--bd:#2A303A;--pri:#33C0FF;--pri-tx:#06212E;--ok:#3DBE6B;--warn:#F0A43A;--err:#FF5A5F;--soft:#13283A;--in:#11151A}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 16px}
header .logo{width:32px;height:32px;border-radius:8px;background:#00A0E7;display:grid;place-items:center;color:#fff;font-weight:800}
header .nm{font-weight:700}header .sp{flex:1}header a{color:var(--pri);font-weight:600;text-decoration:none;min-height:44px;display:flex;align-items:center}
.faixa{display:flex;height:4px}.faixa i{flex:1}main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600}
.tab.on{background:var(--pri);color:var(--pri-tx);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 4px}.lead{color:var(--mut);margin:0 0 12px;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}.opt{color:var(--mut);font-weight:400}
input,select,textarea{width:100%;min-height:44px;font:inherit;font-size:16px;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:1px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.seg{display:flex;gap:8px}.seg button{flex:1}
.btn{min-height:44px;border-radius:10px;border:0;background:var(--pri);color:var(--pri-tx);font:inherit;font-weight:700;padding:10px 16px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--bd)}.btn.sm{width:auto;min-height:40px;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.6}.item{border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-top:8px}.item .row{margin-top:6px}
.msg{border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}.msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.msg.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#fff;background:var(--mut)}
.b-Pendente{background:var(--warn)}.b-Emitida{background:var(--ok)}.b-Parcialmente{background:var(--warn)}.b-Atendida{background:#5C6577}.b-Expirada,.b-Cancelada,.b-Recusada{background:var(--err)}
.num{font-weight:800;font-size:17px}.meta{color:var(--mut);font-size:14px}.qr{display:flex;justify-content:center;background:#fff;border-radius:10px;padding:10px;margin:12px 0}.qr svg{width:220px;height:220px}
.vazio{color:var(--mut);text-align:center;padding:24px 8px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}.sheet.on{display:block}
.sheet .box{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px 24px;max-width:640px;margin:0 auto}
video{width:100%;border-radius:10px;background:#000;max-height:46vh;object-fit:cover}.hide{display:none}
.lista-itens{font-size:14px;margin:6px 0 0;padding-left:18px}
</style>
</head>
<body>
<header><div class="logo">HS</div><span class="nm">Autorizações</span><span class="sp"></span><a href="/">Despesas</a></header>
<div class="faixa"><i style="background:#00A0E7"></i><i style="background:#FE0000"></i><i style="background:#FFE500"></i></div>
<main>
  <div class="tabs"><button class="tab on" id="tPedir" type="button">Pedir autorização</button><button class="tab" id="tMinhas" type="button">Minhas</button></div>

  <section id="pPedir">
    <div class="card">
      <h2>Pedir autorização de compra</h2>
      <p class="lead">Substitui o canhoto de papel. Suprimentos aprova e você recebe um QR para mostrar no estabelecimento.</p>
      <form id="fPedir" autocomplete="off">
        <label for="colab">Colaborador</label><input id="colab" list="dlColab" required>
        <datalist id="dlColab"></datalist>
        <label>Empresa</label>
        <div class="seg"><button type="button" class="tab on" data-emp="HS">HS</button><button type="button" class="tab" data-emp="MC">MC</button></div>
        <label for="tipo">Tipo</label>
        <select id="tipo" required><option value="">Escolha…</option><option>Abastecimento</option><option>Material elétrico</option><option>Material de consumo</option><option>Ferramenta</option><option>Peça / manutenção</option><option>Outros</option></select>
        <label for="obra">Obra ou centro de custo</label><input id="obra" required placeholder="Ex.: 4287">
        <label for="estab">Estabelecimento <span class="opt">(opcional)</span></label><input id="estab" placeholder="Posto, loja ou fornecedor">
        <div id="blAbast" class="hide">
          <label for="veic">Veículo (frota ou placa)</label><input id="veic" list="dlPlaca"><datalist id="dlPlaca"></datalist>
          <div class="row">
            <div><label for="km">Km atual</label><input id="km" inputmode="numeric"></div>
            <div><label for="litros">Até quantos litros <span class="opt">(opc.)</span></label><input id="litros" inputmode="decimal"></div>
          </div>
          <label for="comb">Combustível</label>
          <select id="comb"><option value="">Escolha…</option><option>Diesel S-10</option><option>Diesel S-500</option><option>Gasolina</option><option>Etanol</option><option>Arla 32</option></select>
        </div>
        <div id="blItens">
          <label>Itens</label>
          <div id="itens"></div>
          <button class="btn ghost sm" type="button" id="addItem" style="margin-top:8px">+ Adicionar item</button>
        </div>
        <label for="just">Justificativa <span class="opt">(para que é)</span></label><textarea id="just"></textarea>
        <div id="msgPedir"></div>
        <button class="btn" type="submit" id="btnEnviar" style="margin-top:12px">Enviar pedido</button>
      </form>
    </div>
  </section>

  <section id="pMinhas" class="hide">
    <div class="row" style="margin-bottom:12px"><button class="btn ghost" type="button" id="btnAtualizar">Atualizar</button></div>
    <div id="lista"></div>
  </section>
</main>

<div class="sheet" id="sheet"><div class="box">
  <h2>Registrar o cupom</h2>
  <p class="lead" id="shNum"></p>
  <div class="row"><button class="btn" type="button" id="btnCam">Ler QR do cupom</button><button class="btn ghost" type="button" id="btnFechaCam">Fechar câmera</button></div>
  <video id="video" class="hide" autoplay muted playsinline></video>
  <label for="cLink">Ou cole o link / a chave do cupom <span class="opt">(44 números)</span></label>
  <textarea id="cLink" style="min-height:56px"></textarea>
  <button class="btn ghost sm" type="button" id="btnLerLink" style="margin-top:8px">Usar este link</button>
  <div id="cInfo" class="meta" style="margin-top:8px"></div>
  <label for="cEstab">Estabelecimento</label><input id="cEstab">
  <div class="row">
    <div><label for="cData">Data do cupom</label><input id="cData" type="date"></div>
    <div><label for="cValor">Valor total (R$)</label><input id="cValor" inputmode="decimal"></div>
  </div>
  <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="cParcial" style="width:22px;min-height:22px"> Foi atendido só em parte (ainda falta comprar)</label>
  <label for="cObs">Observação <span class="opt">(opcional)</span></label><input id="cObs">
  <div id="msgCupom"></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" type="button" id="btnCancelaCupom">Cancelar</button><button class="btn" type="button" id="btnSalvaCupom">Registrar</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function () {
  "use strict";
  var API = "/api";
  var SERVIDOR = "https://nfce.hsgestao.app";               // o mesmo servidor do app de despesas (lê o cupom na SEFAZ)
  var HS_TOKEN = "8d5c9fe3668fd08f303ba8f2eeb71996b21374117c93b93b";
  var LS = "hsAutMinhas", LS_COLAB = "hsAutColab";
  var $ = function (id) { return document.getElementById(id); };
  var empresa = "HS", atual = null, leitor = null, cupom = { itens: [] };

  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function msg(el, t, tipo) { $(el).innerHTML = t ? '<div class="msg ' + (tipo || "err") + '">' + esc(t) + '</div>' : ""; }
  function ler() { try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch (e) { return []; } }
  function gravar(l) { try { localStorage.setItem(LS, JSON.stringify(l)); } catch (e) {} }
  function guardar(n, k) { var l = ler().filter(function (x) { return x.n !== n; }); l.unshift({ n: n, k: k }); gravar(l.slice(0, 40)); }
  function quando(iso) { if (!iso) return ""; try { return new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } }
  function brl(v) { return v == null ? "" : "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function numBR(s) { s = String(s || "").trim(); if (!s) return null; if (s.indexOf(",") >= 0) s = s.replace(/\./g, "").replace(",", "."); var n = Number(s.replace(/[^0-9.\-]/g, "")); return isFinite(n) ? n : null; }
  function postar(url, corpo) {
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, erro: "http_" + r.status }; }); });
  }

  // link recebido de Suprimentos: /autorizacao/#n=AUT-...&k=...
  (function () {
    var h = location.hash.replace(/^#/, ""); if (!h) return;
    var p = {}; h.split("&").forEach(function (x) { var i = x.indexOf("="); if (i > 0) p[x.slice(0, i)] = decodeURIComponent(x.slice(i + 1)); });
    if (p.n && p.k) { guardar(p.n, p.k); history.replaceState(null, "", location.pathname); setTimeout(function () { aba("minhas"); }, 0); }
  })();

  // ---- abas ----
  function aba(qual) {
    $("tPedir").classList.toggle("on", qual === "pedir"); $("tMinhas").classList.toggle("on", qual === "minhas");
    $("pPedir").classList.toggle("hide", qual !== "pedir"); $("pMinhas").classList.toggle("hide", qual !== "minhas");
    if (qual === "minhas") carregarMinhas();
  }
  $("tPedir").addEventListener("click", function () { aba("pedir"); });
  $("tMinhas").addEventListener("click", function () { aba("minhas"); });

  // ---- listas (as mesmas do app de despesas) ----
  try { $("colab").value = localStorage.getItem(LS_COLAB) || ""; } catch (e) {}
  fetch(API + "/opcoes").then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.ok) return;
    $("dlColab").innerHTML = (j.colaboradores || []).map(function (c) { return '<option value="' + esc(c) + '">'; }).join("");
    $("dlPlaca").innerHTML = (j.placa || []).map(function (c) { return '<option value="' + esc(c) + '">'; }).join("");
  }).catch(function () {});

  document.querySelectorAll("[data-emp]").forEach(function (b) {
    b.addEventListener("click", function () { empresa = b.getAttribute("data-emp"); document.querySelectorAll("[data-emp]").forEach(function (x) { x.classList.toggle("on", x === b); }); });
  });
  $("tipo").addEventListener("change", function () {
    var ab = $("tipo").value === "Abastecimento";
    $("blAbast").classList.toggle("hide", !ab); $("blItens").classList.toggle("hide", ab);
  });
  function novoItem() {
    var d = document.createElement("div"); d.className = "item";
    d.innerHTML = '<input class="iDesc" placeholder="Descrição do material">' +
      '<div class="row"><input class="iQtd" inputmode="decimal" placeholder="Qtd"><input class="iUn" placeholder="Unid. (UN, M, KG…)"><button type="button" class="btn ghost sm iDel" aria-label="Remover item">Remover</button></div>';
    d.querySelector(".iDel").addEventListener("click", function () { d.remove(); if (!$("itens").children.length) novoItem(); });
    $("itens").appendChild(d);
  }
  $("addItem").addEventListener("click", novoItem); novoItem();

  $("fPedir").addEventListener("submit", function (ev) {
    ev.preventDefault(); msg("msgPedir", "");
    var tipo = $("tipo").value, ab = tipo === "Abastecimento";
    var itens = [];
    document.querySelectorAll("#itens .item").forEach(function (d) {
      var desc = d.querySelector(".iDesc").value.trim(); if (!desc) return;
      itens.push({ descricao: desc, qtd: numBR(d.querySelector(".iQtd").value), unidade: d.querySelector(".iUn").value.trim() });
    });
    var corpo = { colaborador: $("colab").value.trim(), empresa: empresa, tipo: tipo, obra: $("obra").value.trim(), estabelecimento: $("estab").value.trim(),
      justificativa: $("just").value.trim(), itens: ab ? [] : itens };
    if (ab) { corpo.veiculo = $("veic").value.trim(); corpo.km = $("km").value.trim(); corpo.combustivel = $("comb").value; corpo.litros_max = $("litros").value.trim(); }
    if (!ab && !itens.length) { msg("msgPedir", "Informe ao menos um item."); return; }
    $("btnEnviar").disabled = true; $("btnEnviar").textContent = "Enviando…";
    postar(API + "/aut/solicitar", corpo).then(function (j) {
      $("btnEnviar").disabled = false; $("btnEnviar").textContent = "Enviar pedido";
      if (!j.ok) { msg("msgPedir", j.msg || ("Não foi possível enviar (" + (j.erro || "erro") + ").")); return; }
      try { localStorage.setItem(LS_COLAB, corpo.colaborador); } catch (e) {}
      guardar(j.numero, j.chave);
      $("fPedir").reset(); $("colab").value = corpo.colaborador; $("itens").innerHTML = ""; novoItem(); $("tipo").dispatchEvent(new Event("change"));
      aba("minhas");
      msg("msgPedir", "");
    }).catch(function () { $("btnEnviar").disabled = false; $("btnEnviar").textContent = "Enviar pedido"; msg("msgPedir", "Sem conexão. Tente de novo."); });
  });

  // ---- minhas autorizações ----
  function qrSvg(texto) { try { var q = qrcode(0, "M"); q.addData(texto); q.make(); return q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); } catch (e) { return '<div class="meta">QR indisponível — mostre o número.</div>'; } }
  function cartao(a, k) {
    var st = a.status, cls = "b-" + String(st).split(" ")[0];
    var h = '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="num">' + esc(a.numero) + '</span><span class="badge ' + cls + '">' + esc(st) + '</span></div>';
    h += '<div class="meta">' + esc(a.tipo) + ' · ' + esc((a.empresa ? a.empresa + " " : "") + a.obra) + (a.veiculo ? ' · ' + esc(a.veiculo) : '') + '</div>';
    if (a.itens && a.itens.length) h += '<ul class="lista-itens">' + a.itens.map(function (x) { return '<li>' + esc(x.descricao) + (x.qtd != null ? ' — ' + esc(String(x.qtd).replace(".", ",")) + ' ' + esc(x.unidade || "") : '') + '</li>'; }).join("") + '</ul>';
    if (a.combustivel) h += '<div class="meta">' + esc(a.combustivel) + (a.litros_max ? ' · até ' + esc(String(a.litros_max).replace(".", ",")) + ' L' : '') + '</div>';
    if (st === "Pendente") h += '<p class="meta">Aguardando Suprimentos aprovar. Pedido em ' + esc(quando(a.solicitado_em)) + '.</p>';
    if (st === "Recusada" || st === "Cancelada") h += '<p class="meta">' + esc(st) + (a.motivo ? ': ' + esc(a.motivo) : '') + '</p>';
    if (a.token_qr && (st === "Emitida" || st === "Parcialmente atendida")) {
      h += '<div class="qr">' + qrSvg(location.origin + "/v/" + a.token_qr) + '</div>';
      h += '<p class="meta" style="text-align:center">Mostre este QR no estabelecimento. Válida até <b>' + esc(quando(a.validade)) + '</b>.</p>';
      h += '<button class="btn" type="button" data-cupom="' + esc(a.numero) + '" data-k="' + esc(k) + '">Registrar o cupom da compra</button>';
    }
    if (st === "Expirada") h += '<p class="meta">Venceu em ' + esc(quando(a.validade)) + '. Se a compra foi feita antes, registre o cupom: </p><button class="btn ghost" type="button" data-cupom="' + esc(a.numero) + '" data-k="' + esc(k) + '">Registrar cupom</button>';
    if (a.atendimentos && a.atendimentos.length) h += '<p class="meta">Cupons: ' + a.atendimentos.map(function (x) { return esc((x.numero_nf ? "NF " + x.numero_nf + " · " : "") + brl(x.valor_total)); }).join(" | ") + '</p>';
    return h + '</div>';
  }
  function carregarMinhas() {
    var l = ler();
    if (!l.length) { $("lista").innerHTML = '<div class="vazio">Nenhuma autorização neste aparelho ainda.</div>'; return; }
    $("lista").innerHTML = '<div class="vazio">Carregando…</div>';
    Promise.all(l.map(function (x) {
      return fetch(API + "/aut/ver?n=" + encodeURIComponent(x.n) + "&k=" + encodeURIComponent(x.k)).then(function (r) { return r.json(); })
        .then(function (j) { return j.ok ? cartao(j.autorizacao, x.k) : '<div class="card"><span class="num">' + esc(x.n) + '</span><div class="meta">Não encontrada.</div></div>'; })
        .catch(function () { return '<div class="card"><span class="num">' + esc(x.n) + '</span><div class="meta">Sem conexão.</div></div>'; });
    })).then(function (cards) {
      $("lista").innerHTML = cards.join("");
      document.querySelectorAll("[data-cupom]").forEach(function (b) { b.addEventListener("click", function () { abrirCupom(b.getAttribute("data-cupom"), b.getAttribute("data-k")); }); });
    });
  }
  $("btnAtualizar").addEventListener("click", carregarMinhas);

  // ---- registrar o cupom (atendimento) ----
  function extrairChave(txt) {
    try { var m = String(txt).match(/[?&]p=([^&#]+)/i); if (m) { var p = decodeURIComponent(m[1]).split("|")[0].replace(/\D/g, ""); if (p.length >= 44) return p.slice(0, 44); } } catch (e) {}
    var d = String(txt).replace(/\s/g, "").match(/\d{44}/); return d ? d[0] : null;
  }
  function usarTexto(txt) {
    var ch = extrairChave(txt);
    if (!ch) { $("cInfo").textContent = "Não achei a chave do cupom nesse texto."; return; }
    cupom = { chave: ch, cnpj: ch.slice(6, 20), numero_nf: String(parseInt(ch.slice(25, 34), 10)), itens: [] };
    var ident = "Cupom nº " + cupom.numero_nf + " · CNPJ " + cupom.cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5");
    if (!/^https?:\/\//i.test(txt)) { $("cInfo").textContent = ident + " — só com a chave não dá para buscar os itens: preencha o valor."; return; }
    $("cInfo").textContent = ident + " — buscando os itens na SEFAZ…";
    var ctrl = ("AbortController" in window) ? new AbortController() : null; var to = setTimeout(function () { if (ctrl) ctrl.abort(); }, 45000);
    fetch(SERVIDOR + "/nota?u=" + encodeURIComponent(txt), { headers: { "X-HS-Token": HS_TOKEN }, signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { return r.json(); }).then(function (j) {
        clearTimeout(to);
        if (!j || !j.ok || !j.dados) { $("cInfo").textContent = "Cupom lido. A SEFAZ não respondeu — preencha o valor."; return; }
        var d = j.dados, tot = 0;
        cupom.itens = (d.itens || []).map(function (x) { var v = numBR(x.vlTotal); if (v) tot += v; return { descricao: x.descricao, qtd: numBR(x.qtde), unidade: x.unidade, valor: v }; });
        if (d.estabelecimento) $("cEstab").value = d.estabelecimento;
        var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(d.dataEmissao || ""); if (m) $("cData").value = m[3] + "-" + m[2] + "-" + m[1];
        if (tot > 0) $("cValor").value = tot.toFixed(2).replace(".", ",");
        $("cInfo").textContent = "Cupom nº " + cupom.numero_nf + " · " + cupom.itens.length + " item(ns) · " + brl(tot);
      }).catch(function () { clearTimeout(to); $("cInfo").textContent = "Cupom lido. Servidor fora do ar — preencha o valor."; });
  }
  function pararCam() { try { if (leitor) leitor.reset(); } catch (e) {} $("video").classList.add("hide"); }
  $("btnCam").addEventListener("click", function () {
    if (!(window.ZXing && ZXing.BrowserQRCodeReader)) { $("cInfo").textContent = "Leitor não carregou — cole o link do cupom."; return; }
    $("video").classList.remove("hide"); leitor = new ZXing.BrowserQRCodeReader();
    leitor.decodeFromConstraints({ video: { facingMode: { ideal: "environment" } } }, $("video"), function (res) {
      if (res) { var t = res.getText(); if (extrairChave(t)) { pararCam(); $("cLink").value = t; usarTexto(t); } }
    }).catch(function () { pararCam(); $("cInfo").textContent = "Não consegui abrir a câmera. Cole o link do cupom."; });
  });
  $("btnFechaCam").addEventListener("click", pararCam);
  $("btnLerLink").addEventListener("click", function () { usarTexto($("cLink").value.trim()); });
  function abrirCupom(n, k) {
    atual = { n: n, k: k }; cupom = { itens: [] };
    ["cLink", "cEstab", "cValor", "cObs"].forEach(function (id) { $(id).value = ""; });
    var hj = new Date(); $("cData").value = hj.getFullYear() + "-" + String(hj.getMonth() + 1).padStart(2, "0") + "-" + String(hj.getDate()).padStart(2, "0"); $("cParcial").checked = false; $("cInfo").textContent = ""; msg("msgCupom", "");
    $("shNum").textContent = "Autorização " + n; $("sheet").classList.add("on");
  }
  function fecharCupom() { pararCam(); $("sheet").classList.remove("on"); }
  $("btnCancelaCupom").addEventListener("click", fecharCupom);
  $("btnSalvaCupom").addEventListener("click", function () {
    var valor = numBR($("cValor").value);
    if (!valor) { msg("msgCupom", "Informe o valor total do cupom."); return; }
    $("btnSalvaCupom").disabled = true;
    postar(API + "/aut/atender", { n: atual.n, k: atual.k, chave_nfce: cupom.chave || "", cnpj: cupom.cnpj || "", numero_nf: cupom.numero_nf || "",
      estabelecimento: $("cEstab").value.trim(), data_cupom: $("cData").value, valor_total: valor, itens: cupom.itens, parcial: $("cParcial").checked, observacao: $("cObs").value.trim() })
      .then(function (j) {
        $("btnSalvaCupom").disabled = false;
        if (!j.ok) { msg("msgCupom", j.msg || ("Não registrado (" + (j.erro || "erro") + ").")); return; }
        fecharCupom(); carregarMinhas();
      }).catch(function () { $("btnSalvaCupom").disabled = false; msg("msgCupom", "Sem conexão. Tente de novo."); });
  });
})();
</script>
</body>
</html>
